name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore z_compression.slnx --configfile NuGet.Config
      - run: dotnet build z_compression.slnx -c Release --no-restore
      - run: dotnet test tests/ZCompression.Tests/ZCompression.Tests.csproj -c Release --no-build
      - run: dotnet publish src/ZCompression.App/ZCompression.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true --no-restore -o artifacts/${{ matrix.rid }}
      - shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath "z_compression-${{ github.ref_name }}-${{ matrix.rid }}.zip"
          (Get-FileHash "z_compression-${{ github.ref_name }}-${{ matrix.rid }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "z_compression-${{ github.ref_name }}-${{ matrix.rid }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: z_compression-${{ matrix.rid }}
          path: |
            z_compression-*.zip
            z_compression-*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - shell: pwsh
        run: |
          $asset = Get-Item "release/z_compression-${{ github.ref_name }}-win-x64.zip"
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            version = "${{ github.ref_name }}".TrimStart('v')
            downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($asset.Name)"
            sha256 = $hash
            size = $asset.Length
            releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          } | ConvertTo-Json
          Set-Content -Path "release/update-manifest.json" -Value $manifest -Encoding utf8NoBOM
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
